name: Audit uSwap Zero
on:
  push:
    branches: ['audit/uswap-zero-p0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/uswap-zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/uswap-zero/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
