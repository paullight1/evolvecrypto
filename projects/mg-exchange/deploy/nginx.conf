# Production nginx config with TLS termination
# Place SSL certs in deploy/certs/: fullchain.pem + privkey.pem
#
# SETUP: This file must be included inside the http{} block of the main
# nginx.conf. Add the following to /etc/nginx/nginx.conf (inside http {}):
#
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   include /etc/nginx/conf.d/exchange.conf;
#
# Or use this file AS the main nginx.conf by wrapping in:
#   http { limit_req_zone ...; <contents of this file> }

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # TLS
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'" always;

    # Frontend (static files from web container)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }

    # API
    location /api/ {
        proxy_pass http://exchange:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://exchange:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin (internal IPs only — never expose to public internet)
    location /admin/ {
        proxy_pass http://exchange:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # Prometheus metrics (internal only)
    location /metrics {
        proxy_pass http://exchange:8080;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # Webhooks (custody, KYC, fiat — must be reachable by providers)
    location /webhooks/ {
        proxy_pass http://exchange:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://exchange:8080;
    }
}

# NOTE: limit_req_zone directive has been moved to the http{} block instructions above.
# It cannot be placed here if this file is used as a conf.d include.
