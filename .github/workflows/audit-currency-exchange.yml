name: Audit Currency Exchange
on:
  push:
    branches: ['audit/currency-exchange-p0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/currency-exchange-platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: PHP syntax check (no database required)
        run: find app routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
      - name: Explain blocked integration tests
        run: echo 'PHPUnit requires a configured test database; artisan package discovery currently queries general_settings during bootstrap. Database-dependent tests are intentionally not marked passing.'
